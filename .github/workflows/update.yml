# Met à jour les données chaque jour ouvré et publie le site sur GitHub Pages.
# Prérequis (une fois) : Settings → Pages → Source : « GitHub Actions ».
name: Mise à jour et publication

on:
  schedule:
    - cron: "0 18 * * 1-5"   # 18 h UTC, après la clôture des marchés européens
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]

permissions:
  contents: write   # enregistrer les nouvelles données
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Données du $(date +%d/%m/%Y)"
          git push

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # inclut le commit de données fait juste avant
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
